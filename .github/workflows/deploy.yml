# This workflow builds a Go binary and deploys it to the production Linux VM
# when a version tag is pushed or when manually dispatched.
#
# !! REQUIRES GITHUB SECRETS !!
# Before this works, you MUST add the following secrets to your repository
# (Settings > Secrets and variables > Actions):
#
# 1. VM_HOST: The IP address or DNS name of your Linux VM.
#    Example: 123.45.67.89
#
# 2. VM_USER: The username to log in with (e.g., "ubuntu", "admin").
#    Example: ubuntu
#
# 3. VM_SSH_KEY: The private SSH key (NOT the public key) that has access
#    to your VM.
#    Example: -----BEGIN OPENSSH PRIVATE KEY-----...
#
# 4. VM_DEST_PATH: The *full* destination path for the binary on your VM.
#    Example: /home/ubuntu/my-go-app/my-binary
#
name: Build and Deploy Go App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # Run the build job on the latest GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Go Binary
        run: GOOS=linux GOARCH=amd64 go build -v -o kingshot ./cmd/discord

      # Step 4: Upload the built binary as an artifact
      # This makes the "my-app-binary" file available to other jobs (like 'deploy')
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-binary
          path: kingshot

  deploy:
    # Run the deploy job on the latest GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest
    
    # This job depends on the "build" job finishing successfully
    needs: build
    environment:
      name: production

    steps:
      # Step 1: Download the binary artifact from the "build" job
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: go-binary

      # Step 2: Make the downloaded binary executable
      - name: Make binary executable
        run: chmod +x kingshot

      # Step 3: Load SSH key into agent
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      # Step 4: Add VM host key to known_hosts
      - name: Add VM to known hosts
        run: ssh-keyscan -T 10 -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy binary to VM via scp
        run: |
          scp -v ./kingshot "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/kingshot.tmp"

      - name: Restart application on VM
        run: |
          ssh "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" '
          set -eu
          destination="${{ secrets.VM_DEST_PATH }}"
          case "$destination" in
            "~/"*) destination="$HOME/${destination#\~/}" ;;
          esac
          if sudo test -d "$destination"; then
            destination="$destination/kingshot"
          fi
          destination_directory="$(dirname "$destination")"
          echo "Deployment destination: $destination"
          echo "Deployment directory: $destination_directory"
          sudo test -d "$destination_directory" || {
            echo "Deployment directory does not exist: $destination_directory" >&2
            exit 1
          }
          echo "Placing new binary..."
          sudo mv ~/kingshot.tmp "$destination"
          sudo chmod +x "$destination"
          echo "Restarting service..."
          sudo systemctl restart kingshot.service
          sudo systemctl is-active --quiet kingshot.service
          service_executable="$(sudo systemctl show kingshot.service --property=ExecStart --value | sed -n "s/.*path=\([^ ;]*\).*/\1/p")"
          if [ -n "$service_executable" ] && [ "$(sudo readlink -f "$service_executable")" != "$(sudo readlink -f "$destination")" ]; then
            echo "kingshot.service is running a different executable: $service_executable" >&2
            exit 1
          fi
          echo "Deployed executable: $destination"
          sudo sha256sum "$destination"
          echo "Deployment complete."
          '
